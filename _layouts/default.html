<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <!--
    <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
    --!>

    <nav>
    <h1 class="title">{{page.title}}</h1>
        <div class="nav-links">
            <a href="/" class="{% if page.url == '/' %}active{% endif %}">Home</a>
            <a href="/projects/" class="{% if page.url == '/projects/' %}active{% endif %}">Projects</a>
            <a href="/cv/" class="{% if page.url == '/cv/' %}active{% endif %}">CV</a>
            <!--
            <a href="#">About</a>
            <a href="#">Archive</a>
            --!>
        </div>
    </nav>
    <main>
      {{ content }}
    </main>

    <script src="{{ "/assets/js/svg-pan-zoom.min.js" | relative_url }}"></script>
    <script>
        function toggleTheme() {
            document.body.dataset.theme =
                document.body.dataset.theme === 'dark' ? 'light' : 'dark';
        }
        hljs.highlightAll();

        // Initialize svg-pan-zoom for object-embedded SVGs
        document.querySelectorAll('.network-svg-object').forEach(obj => {
            obj.addEventListener('load', function() {
                svgPanZoom(this, {
                    minZoom: 0.5,
                    maxZoom: 10,
                    zoomScaleSensitivity: 0.1,
                    fit: true,
                    center: true
                });
            });
        });

        // Monitoring image expand/collapse
        function toggleMonitoring(imgId) {
            const img = document.getElementById(imgId);
            const wrapper = img.parentElement;
            const btn = wrapper.querySelector('.monitoring-toggle');
            if (wrapper.style.height === 'auto') {
                wrapper.style.height = wrapper.dataset.initialHeight;
                btn.textContent = 'Show More';
            } else {
                wrapper.style.height = 'auto';
                btn.textContent = 'Show Less';
            }
        }

        // Cache initial heights so JS doesn't hardcode them
        document.querySelectorAll('.monitoring-img').forEach(img => {
            const wrapper = img.parentElement;
            wrapper.dataset.initialHeight = getComputedStyle(wrapper).height;
        });
    </script>
  </body>
</html
